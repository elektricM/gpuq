# gpuq for compose.yaml next to this file. Install as /etc/gpuq/config.toml.
# gpuq runs on the host (not in a container) and needs the docker group to start and stop
# the comfyui container; see README.md here.

[gate]
host = "*"                           # Open WebUI reaches it from its container; firewall
port = 11434                         # 11434 and 8188 if the machine is on an open network
backend = "http://127.0.0.1:11435"   # the ollama container

[llm]
backend = "ollama"
resident = "qwen3.8:27b"              # loaded when the card is idle; empty = load on demand
idle_s = 300                         # batch jobs wait this long after the last chat request

[[service]]
name = "comfyui"
flavor = "comfyui"
class = "interactive"
vram = "12G"
yieldable = true
stop_on_release = true
idle_release_s = 120                 # no queued or running prompt for this long: stop it

[service.control]
kind = "docker"
container = "comfyui"
health_url = "http://127.0.0.1:8189/system_stats"
start_timeout_s = 300

[service.gate]
listen = "0.0.0.0:8188"              # what you open in the browser, and what Open WebUI uses
backend = "http://127.0.0.1:8189"    # the comfyui container
gpu_paths = ["/prompt"]
