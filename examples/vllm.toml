# gpuq in front of vLLM. vLLM cannot unload a model while running, so "unload" means
# stopping it and "load" means starting it again (and waiting for /health).
# Install as /etc/gpuq/config.toml.
#
# What else to change:
#   * Move vLLM off the port clients use: `--host 127.0.0.1 --port 8001` in its unit or
#     container, and gpuq takes 8000.
#   * Pick ONE [llm.service] block. Docker is active; systemd and command are below.
#   * gpuq needs permission to run the control command: see docs/integrations.md
#     (docker group, or a polkit rule for systemd units).
#   * vLLM reserves most of the card (--gpu-memory-utilization), so GPU jobs take turns
#     with it: they wait for idle_s of silence, then vLLM is stopped for them.
#
# SGLang is the same with backend = "sglang"; see sglang.toml.

[gate]
host = "127.0.0.1"
port = 8000
backend = "http://127.0.0.1:8001"

[llm]
backend = "vllm"
idle_s = 300
gap_s = 10

[llm.service]
kind = "docker"
container = "vllm"
health_url = "http://127.0.0.1:8001/health"
start_timeout_s = 900                # vLLM can take minutes to load a big model

# systemd variant (replace the table above):
# [llm.service]
# kind = "systemd"
# unit = "vllm.service"
# user = false
# health_url = "http://127.0.0.1:8001/health"
# start_timeout_s = 900

# Command variant, for anything else (docker compose, a script):
# [llm.service]
# kind = "command"
# start = ["/usr/local/bin/vllm-start"]
# stop = ["/usr/local/bin/vllm-stop"]
# status = ["/usr/local/bin/vllm-status"]   # optional: exit 0 = running
# health_url = "http://127.0.0.1:8001/health"
