<!doctype html>
<!-- The overview video, scene by scene, in the overview diagram's bold flat style.
     draw(t) paints the frame at t seconds; render.py captures it frame by frame.
     Open with ?w=1280&h=720 or ?w=1080&h=1080, then call draw(t) in the console. -->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff8ef;overflow:hidden}svg{display:block}</style>
</head>
<body>
<div id="frame"></div>
<script>
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1280), H = +(Q.get('h') || 720);
const C = { llm: '#a66cff', comfy: '#3d8bff', whisper: '#00b37e', api: '#ffb400', grey: '#4a4a4a',
            ink: '#1f1f1f', muted: '#4a4a4a', track: '#f0e6d8', red: '#ff4d4d', yellow: '#ffd400', dark: '#1f2328' };
const FONT = 'Inter, Helvetica, Arial, sans-serif';
const MONO = 'JetBrains Mono, DejaVu Sans Mono, monospace';

// easing and timing
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const P = (t, a, b, f = io) => f(clamp((t - a) / (b - a)));
const L = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// drawing, same strokes, radii and shadows as docs/overview.svg, scaled up
function text(x, y, s, o = {}) {
  const { size = 28, weight = 600, fill = C.ink, anchor = 'middle', op = 1, font = FONT } = o;
  return `<text x="${x}" y="${y}" font-family="${font}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" opacity="${op}">${esc(s)}</text>`;
}
function g(inner, { op = 1, tx = 0, ty = 0, s = 1, cx = 0, cy = 0 } = {}) {
  if (op <= 0.002 || !inner) return '';
  const sc = s !== 1 ? ` translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})` : '';
  return `<g opacity="${clamp(op).toFixed(3)}" transform="translate(${tx} ${ty})${sc}">${inner}</g>`;
}
function pill(x, y, w, h, fill, label, o = {}) {
  const { tc = '#ffffff', sub = null, size = 32 } = o;
  let s = `<g filter="url(#sh)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h * .4}" fill="${fill}" stroke="${C.ink}" stroke-width="4"/></g>`;
  if (sub) s += text(x + 28, y + h / 2 + size * .36, label, { size, weight: 700, fill: tc, anchor: 'start' })
             + text(x + w - 24, y + h / 2 + 9, sub, { size: 24, weight: 500, fill: tc, anchor: 'end', op: .85 });
  else s += text(x + w / 2, y + h / 2 + size * .36, label, { size, weight: 700, fill: tc });
  return s;
}
function card(x, y, w, h, title, o = {}) {
  const { stroke = C.ink, sw = 4.5 } = o;
  return `<g filter="url(#sh)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="24" fill="#ffffff" stroke="${stroke}" stroke-width="${sw}"/></g>`
    + (title ? text(x + w / 2, y + 54, title, { size: 32, weight: 800 }) : '');
}
function box(x, y, w, h, o = {}) {
  const { title = 'gpuq', size = 46, ty = 64 } = o;
  return `<g filter="url(#sh)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="${C.ink}" stroke="${C.ink}" stroke-width="4"/></g>`
    + text(x + w / 2, y + ty, title, { size, weight: 800, fill: C.yellow });
}
const track = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${C.track}"/>`;
function seg(x, y, w, h, fill, label, o = {}) {
  if (w < 1) return '';
  const { tc = '#ffffff', size = 28 } = o;
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}"/>`;
  if (label && w > label.length * size * .52 + 20) s += text(x + w / 2, y + h / 2 + size * .36, label, { size, weight: 700, fill: tc });
  return s;
}
function chip(x, y, w, h, col, label, solid, o = {}) {
  const { size = 26, tc = '#ffffff' } = o;
  if (solid) return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${col}"/>` + text(x + w / 2, y + h / 2 + size * .36, label, { size, weight: 700, fill: tc });
  return `<rect x="${x + 1.5}" y="${y + 1.5}" width="${w - 3}" height="${h - 3}" rx="12" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="9 6"/>`
    + text(x + w / 2, y + h / 2 + size * .36, label, { size, weight: 700, fill: col });
}
function arrow(x1, y1, x2, y2, k, col = C.muted, w = 4) {
  if (k <= .01) return '';
  return `<path d="M${x1},${y1} L${L(x1, x2, k)},${L(y1, y2, k)}" stroke="${col}" stroke-width="${w}" fill="none" marker-end="url(#${col === C.red ? 'mr' : 'mg'})"/>`;
}
const blink = (t, a, n = 3, p = .12) => (t < a ? 0 : t > a + n * 2 * p ? 1 : (Math.floor((t - a) / p) % 2 ? .25 : 1));
const pulse = (t, a, b) => (t < a || t > b ? 1 : .6 + .4 * Math.cos((t - a) * 9));

// A brief outline pulse around the thing that changes, starting at scene time a.
function ring(x, y, w, h, t, a, col = C.ink, rx = 16) {
  const k = clamp((t - a) / .4);
  if (k <= 0 || k >= 1) return '';
  const e = 4 + 16 * out(k);
  return `<rect x="${x - e}" y="${y - e}" width="${w + 2 * e}" height="${h + 2 * e}" rx="${rx + e}" fill="none" stroke="${col}" stroke-width="${(6 * (1 - k) + 1).toFixed(2)}" opacity="${(1 - k).toFixed(3)}"/>`;
}
// Crossfade between two drawings (k 0 -> a, 1 -> b), and a label shown inside a window of scene time:
// state changes blend over a few frames instead of switching on one.
const xf = (a, b, k) => g(a, { op: 1 - clamp(k) }) + g(b, { op: clamp(k) });
const win = (t, a, b = 1e9, f = .15) => P(t, a, a + f) * (1 - P(t, b - f, b));
// A chip that becomes a VRAM bar segment: its rectangle moves and resizes from a = [x, y, w, h] to b, its label
// crossfades, and at k = 1 it is exactly the segment that seg() then draws in its place.
function morph(k, a, b, col, la, lb, o = {}) {
  if (k <= 0 || k >= 1) return '';
  const { tc = '#ffffff', sa = 26, sb = 26, op = 1 } = o;
  const [x, y, w, h] = a.map((v, i) => L(v, b[i], k));
  const sz = L(sa, sb, k), cy = y + h / 2 + sz * .36;
  return g(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${L(12, 8, k)}" fill="${col}"/>`
    + text(x + w / 2, cy, la, { size: sz, weight: 700, fill: tc, op: clamp((.5 - k) / .15) })
    + text(x + w / 2, cy, lb, { size: sz, weight: 700, fill: tc, op: clamp((k - .5) / .15) }), { op });
}
const status = (x, y, s) => text(x, y, s, { size: 24, weight: 600, fill: '#ffffff', anchor: 'start' });
function check(cx, cy, r = 20) {
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.whisper}"/><path d="M${cx - 10},${cy + 1} L${cx - 2},${cy + 9} L${cx + 11},${cy - 8}" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
}

// ---- scenes, in a 1120 x 560 stage; each has a main caption and at most two sub-captions ----
function s1(t) {   // the problem: 17 + 12 GB asked of a 24 GB card
  let s = '';
  const kin = P(t, 0, .4, back), kchat = P(t, .4, .8), kimg = P(t, .9, 1.35), crash = t > 1.45;
  const shake = crash && t < 1.75 ? 10 * Math.sin((t - 1.45) * 70) * (1 - (t - 1.45) / .3) : 0;
  s += arrow(355, 182, 586, 228, clamp(kchat * 2), C.red, 5) + arrow(355, 362, 586, 262, clamp(kimg * 2), C.red, 5);
  s += g(pill(30, 140, 320, 84, C.llm, 'Chat model', { sub: '17 GB' }), { tx: L(-420, 0, kin), op: kin * 3 });
  let img = pill(30, 320, 320, 84, C.comfy, 'Image job', { sub: '12 GB' });
  if (crash) img += `<circle cx="344" cy="324" r="24" fill="${C.red}" stroke="${C.ink}" stroke-width="3"/><path d="M335,315 L353,333 M353,315 L335,333" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>`
                  + text(190, 452, 'crashed', { size: 30, weight: 800, fill: C.red, op: blink(t, 1.45, 2, .08) });
  s += g(img, { tx: L(-420, 0, kin), op: kin * 3 });
  // the card: 15 px per GB, so the 24 GB bar ends at x 1000 and the overflow sticks out of the card
  let c = card(600, 90, 440, 380, 'GPU · 24 GB', { stroke: crash ? C.red : C.ink, sw: crash ? 6 : 4.5 });
  c += track(640, 200, 360, 76);
  c += seg(640, 200, 255 * kchat, 76, C.llm, 'chat 17G');
  const wi = 180 * kimg, inside = Math.min(wi, 105);
  c += seg(895, 200, inside, 76, C.comfy, '');
  if (wi > 105) c += `<rect x="1000" y="194" width="${wi - 105}" height="88" rx="6" fill="${C.red}" stroke="${C.ink}" stroke-width="3"/>`
                   + text(1037.5, 247, '+5G', { size: 24, weight: 800, fill: '#ffffff', op: P(t, 1.2, 1.35) });
  c += `<line x1="1000" y1="186" x2="1000" y2="290" stroke="${C.ink}" stroke-width="3"/>`;
  s += g(c, { op: kin * 2, s: L(.88, 1, kin), cx: 820, cy: 280, tx: shake });
  // the crash, as a stamp across the card
  const ks = P(t, 1.45, 1.75, back);
  if (ks > 0) s += g(`<g filter="url(#sh)"><rect x="590" y="352" width="460" height="82" rx="14" fill="${C.red}" stroke="${C.ink}" stroke-width="4"/></g>`
                     + text(820, 406, 'CUDA out of memory', { size: 38, weight: 800, fill: '#ffffff' }),
                     { op: ks * 2, s: L(1.4, 1, ks), cx: 820, cy: 393 });
  return s;
}
function s2(t) {   // the same two programs through gpuq: one runs, the other waits, then they swap
  let s = '';
  const kin = P(t, 0, .35, back);
  s += g(arrow(295, 180, 352, 236, 1) + arrow(295, 370, 352, 318, 1) + arrow(728, 270, 782, 270, 1), { op: kin });
  s += g(pill(0, 140, 290, 80, C.llm, 'Chat model', { sub: '17 GB', size: 28 }) + pill(0, 330, 290, 80, C.comfy, 'Image job', { sub: '12 GB', size: 28 }), { tx: L(-400, 0, kin), op: kin * 3 });
  const kq1 = P(t, .35, .65), kgo = P(t, .7, 1.0), kq2 = P(t, 1.05, 1.35), kun = P(t, 1.85, 2.15), kimg = P(t, 2.25, 2.55);
  let b = box(360, 100, 360, 340) + text(540, 202, 'queue, by priority', { size: 22, weight: 500, fill: '#ffffff' });
  if (kq1 >= 1) b += xf(chip(385, 226, 200, 52, C.llm, '1 chat', true) + status(600, 261, '▶ runs'), chip(385, 226, 200, 52, C.llm, '1 chat', false) + status(600, 261, '· idle'), kun);
  if (kq2 >= 1) b += xf(chip(385, 304, 200, 52, C.comfy, '2 image', false) + status(600, 339, '· waits'), chip(385, 304, 200, 52, C.comfy, '2 image', true) + status(600, 339, '▶ runs'), kimg) + ring(385, 304, 200, 52, t, 1.45, C.yellow, 12);
  s += g(b, { op: kin * 2, s: L(.9, 1, kin), cx: 540, cy: 270 });
  // 11.67 px per GB on a 280 px bar
  let c = card(790, 120, 330, 310, 'GPU · 24 GB') + track(815, 215, 280, 72);
  c += seg(815, 215, kgo >= 1 ? 198 * (1 - kun) : 0, 72, C.llm, 'chat 17G', { size: 26 }) + seg(815, 215, kimg >= 1 ? 140 : 0, 72, C.comfy, 'image 12G', { size: 24 });
  c += text(955, 345, '7 GB free', { size: 26, weight: 700, fill: C.muted, op: win(t, 1.35, 1.85) })
     + text(955, 345, 'chat model unloaded', { size: 26, weight: 700, fill: C.muted, op: win(t, 1.85, 2.25) })
     + text(955, 345, 'no crash', { size: 26, weight: 700, fill: C.whisper, op: win(t, 2.25) }) + ring(815, 215, 280, 72, t, 1.85, C.ink, 8);
  s += g(c, { op: kin * 2, s: L(.9, 1, kin), cx: 955, cy: 270 });
  const fly = (k, x1, y1, x2, y2, col, label) => k > 0 && k < 1 ? chip(L(x1, x2, k), L(y1, y2, k), 200, 52, col, label, true) : '';
  s += fly(kq1, 300, 154, 385, 226, C.llm, '1 chat') + fly(kq2, 300, 344, 385, 304, C.comfy, '2 image');
  s += morph(kgo, [385, 226, 200, 52], [815, 215, 198, 72], C.llm, '1 chat', 'chat 17G') + morph(kimg, [385, 304, 200, 52], [815, 215, 140, 72], C.comfy, '2 image', 'image 12G', { sb: 24 });
  return s;
}
function s3(t) {   // a 30 GB model split 18 + 12 over two cards, unloaded from both for a render
  let s = '';
  const kin = P(t, 0, .35, back), kload = P(t, .35, .8), kq = P(t, .9, 1.2), kun = P(t, 1.4, 1.7), kgo = P(t, 1.8, 2.1), kdone = P(t, 2.25, 2.45), kre = P(t, 2.55, 2.9);
  const up = kload - kun + kre;
  let b = box(0, 120, 300, 320) + text(150, 226, 'queue', { size: 22, weight: 500, fill: '#ffffff' });
  b += xf(chip(22, 252, 160, 52, C.llm, 'chat', false) + status(194, 287, '· waits'), chip(22, 252, 160, 52, C.llm, 'chat', true) + status(194, 287, '▶ runs'), up);
  if (kq > 0 && kdone < 1) b += g(xf(chip(22, 330, 160, 52, C.api, 'render', false, { tc: C.dark }) + status(194, 365, '· waits'),
                                     chip(22, 330, 160, 52, C.api, 'render', true, { tc: C.dark }) + status(194, 365, '▶ runs'), kgo * 3), { op: kq * (1 - kdone), tx: L(-60, 0, kq) });
  b += ring(22, 330, 160, 52, t, 1.2, C.yellow, 12);
  s += g(b, { op: kin * 2, s: L(.9, 1, kin), cx: 150, cy: 280 });
  s += g(arrow(306, 280, 392, 150, 1) + arrow(306, 280, 392, 410, 1), { op: kin });
  // 25 px per GB: GPU 0 has a 600 px bar, GPU 1 a 400 px one
  let c = card(400, 20, 700, 230, 'GPU 0 · 24 GB') + card(400, 300, 480, 230, 'GPU 1 · 16 GB');
  c += track(440, 110, 600, 72) + track(440, 390, 400, 72);
  if (up > 0) c += `<rect x="452" y="176" width="40" height="220" fill="${C.llm}" opacity="${clamp(up * 1.5 - .5).toFixed(3)}"/>`;
  c += seg(440, 110, 450 * up, 72, C.llm, 'chat model 18G') + seg(440, 390, 300 * up, 72, C.llm, 'chat model 12G');
  c += text(510, 286, 'one 30 GB model', { size: 28, weight: 800, fill: C.llm, anchor: 'start', op: clamp((up - .75) / .25) });
  c += seg(440, 390, kgo >= 1 ? 400 * (1 - kdone) : 0, 72, C.api, 'render 16G', { tc: C.dark });
  c += ring(440, 110, 600, 72, t, 1.4, C.ink, 8) + ring(440, 390, 400, 72, t, 1.4, C.ink, 8);
  s += g(c, { op: kin * 2, s: L(.92, 1, kin), cx: 750, cy: 275 });
  s += morph(kgo, [22, 330, 160, 52], [440, 390, 400, 72], C.api, 'render', 'render 16G', { tc: C.dark, sb: 28 });
  return s;
}
function s4(t) {   // the desktop frees its VRAM for a job, then comes back
  let s = '';
  const kin = P(t, 0, .35, back), kseat = P(t, .6, .9, back), kstop = P(t, 1.05, 1.35), kgo = P(t, 1.5, 1.85), kdone = P(t, 2.05, 2.3), kback = P(t, 2.4, 2.7, back);
  s += g(pill(0, 100, 450, 84, '#ffffff', '') + check(48, 142) + text(84, 153, 'nobody at the screen', { size: 30, weight: 700, anchor: 'start' }),
         { op: kseat * 2, s: L(.85, 1, kseat), cx: 225, cy: 142 });
  const ksolid = clamp(kgo / .3);  // the waiting chip turns solid as it starts to move
  if (kgo <= 0) s += g(chip(0, 330, 380, 76, C.comfy, 'image job 15 GB · waits', false, { size: 28 }) + ring(0, 330, 380, 76, t, .45, C.comfy, 12),
                       { tx: L(-440, 0, kin), op: clamp(kin * 3) });
  s += g(chip(0, 330, 380, 76, C.comfy, 'image job 15 GB · waits', false, { size: 28 }), { op: kgo > 0 ? 1 - ksolid : 0 });
  // 33.75 px per GB on a 540 px bar
  let c = card(500, 100, 620, 360, 'GPU 1 · 16 GB') + track(540, 220, 540, 80);
  const kd = 1 - kstop + kback;
  c += seg(540, 220, 67.5 * kd, 80, C.grey, '');
  const dx = 540 + 67.5 * clamp(kd) + 18, dt = (s, fill, op) => text(dx, 271, s, { size: 28, weight: 700, anchor: 'start', fill, op: clamp(op) });
  c += dt('your desktop 2G', C.ink, 1 - P(t, 1.05, 1.2)) + dt('desktop stopped', C.muted, win(t, 1.15, 1.55)) + dt('desktop back', C.ink, kback);
  c += seg(540, 220, kgo >= 1 ? 506 * (1 - kdone) : 0, 80, C.comfy, 'image job 15G');
  const free = `${Math.round(16 - 2 * clamp(kd) - 15 * clamp(kgo - kdone))} GB free`;  // counts with the bars
  c += text(810, 380, free, { size: 28, weight: 700, fill: C.muted }) + ring(540, 220, 67.5, 80, t, 1.05, C.ink, 8);
  s += g(c, { op: kin * 2, s: L(.9, 1, kin), cx: 810, cy: 280 });
  s += morph(kgo, [0, 330, 380, 76], [540, 220, 506, 80], C.comfy, 'image job 15 GB', 'image job 15G', { sa: 28, sb: 28, op: ksolid });
  return s;
}
function s5(t) {   // the gate holds a chat request; a request for another model waits for chat to be quiet
  let s = '';
  const kin = P(t, 0, .35, back), kc = P(t, .3, .6, out), kfree = P(t, .9, 1.15), kload = P(t, 1.2, 1.5), kcgo = P(t, 1.6, 1.85);
  const ko = P(t, 2.0, 2.3, out), kun = P(t, 2.65, 2.9), kol = P(t, 2.95, 3.2);
  s += g(box(120, 100, 400, 360) + text(320, 202, 'holds requests', { size: 22, weight: 500, fill: '#ffffff' }), { op: kin * 2, s: L(.9, 1, kin), cx: 320, cy: 280 });
  s += g(arrow(528, 280, 632, 280, 1), { op: kin });
  // 17.5 px per GB on a 420 px bar
  let c = card(640, 120, 480, 320, 'GPU · 24 GB') + track(670, 215, 420, 72);
  c += seg(670, 215, 210 * (1 - kfree), 72, C.comfy, 'image job 12G');
  c += seg(670, 215, 297.5 * kload * (1 - kun), 72, C.llm, 'chat model 17G') + seg(670, 215, kol >= 1 ? 210 : 0, 72, C.api, 'other model 12G', { tc: C.dark, size: 23 });
  const nt = (s, fill, op) => text(880, 360, s, { size: 26, weight: 700, fill, op: clamp(op) });
  c += nt('GPU busy', C.muted, 1 - P(t, .9, 1.05)) + nt('chat answered', C.whisper, win(t, 1.85, 2.0)) + nt('chat still in use', C.muted, win(t, 2.0, 2.65))
     + nt('one swap, when quiet', C.whisper, win(t, 3.2)) + ring(670, 215, 420, 72, t, 2.65, C.ink, 8);
  s += g(c, { op: kin * 2, s: L(.92, 1, kin), cx: 880, cy: 280 });
  if (kc > 0 && kcgo <= 0) s += g(chip(150, 226, 340, 58, C.llm, 'chat · held', true) + ring(150, 226, 340, 58, t, .6, C.yellow, 12), { tx: L(-560, 0, kc) });
  s += morph(kcgo, [150, 226, 340, 58], [670, 215, 297.5, 72], C.llm, 'chat', '', { op: 1 - P(kcgo, .6, 1, x => x) });
  if (ko > 0 && kol <= 0) s += g(xf(chip(150, 310, 340, 58, C.api, 'other model · waits', true, { tc: C.dark }) + ring(150, 310, 340, 58, t, 2.3, C.yellow, 12),
                                    chip(150, 310, 340, 58, C.api, 'other model', true, { tc: C.dark }), kun), { tx: L(-560, 0, ko) });
  s += morph(kol, [150, 310, 340, 58], [670, 215, 210, 72], C.api, 'other model', 'other model 12G', { tc: C.dark, sb: 23 });
  return s;
}
function s6(t) {   // end card
  let s = '';
  const k = P(t, 0, .35, back), kp = P(t, .2, .5, out), kc = P(t, .4, .7, back), ku = P(t, .55, .85, out);
  s += g(box(300, 20, 520, 200, { size: 150, ty: 152 }), { op: k * 2, s: L(.8, 1, k), cx: 560, cy: 120 });
  s += g(text(560, 300, 'Stop CUDA out of memory when Ollama,', { size: 36, weight: 700 }) + text(560, 346, 'ComfyUI and your jobs share a GPU.', { size: 36, weight: 700 }), { op: kp, ty: L(18, 0, kp) });
  s += g(`<g filter="url(#sh)"><rect x="330" y="386" width="460" height="80" rx="18" fill="#ffffff" stroke="${C.ink}" stroke-width="4"/></g>` + text(560, 438, 'cargo install gpuq', { size: 36, weight: 700, font: MONO }),
         { op: kc * 2, s: L(.85, 1, kc), cx: 560, cy: 426 });
  s += g(text(560, 530, 'github.com/elektricM/gpuq', { size: 32, weight: 700, fill: C.muted }), { op: ku, ty: L(14, 0, ku) });
  return s;
}

// [scene, length in scene time, caption, sub-captions as [scene time, text]]
const SCENES = [
  [s1, 2.3, 'Ollama and ComfyUI share one GPU.', [[1.45, '17 + 12 = 29 GB asked of a 24 GB card.']]],
  [s2, 2.8, 'gpuq gives the GPU out by turns.', [[1.45, 'Not enough free VRAM: the image job waits its turn.']]],
  [s3, 3.1, 'One big model, split over two GPUs.', [[1.2, 'A render needs all of GPU 1: the model leaves both cards.']]],
  [s4, 2.9, 'Your desktop steps aside for a job.', [[.6, 'The job needs 15 GB, 14 are free, nobody is at the screen.']]],
  [s5, 3.45, 'Requests wait instead of failing.', [[.3, 'GPU busy: the chat request is held, not refused.'], [2.0, 'Another model waits until chat is quiet: no swapping.']]],
  [s6, 1.0, '', []],
];
// Pace: each scene is slowed so that it shows about RATE animation steps per second (STEPS = the P(t, ...) steps
// in its function), never faster than its own timings; then it holds HOLD s on its last frame so the caption can be read.
// The end card holds END_HOLD s so the install command can be read.
const RATE = 2.6, HOLD = 0.7, END_HOLD = 2.6, FADE = .32;
const STEPS = { s1: 6, s2: 8, s3: 8, s4: 7, s5: 9, s6: 4 };
const slow = s => Math.max(1.4, STEPS[s[0].name] / (RATE * s[1]));
const len = s => s[1] * slow(s) + (s[2] ? HOLD : END_HOLD);
const TOTAL = SCENES.reduce((a, s) => a + len(s), 0);

// Split a line in two for the square format: at ': ' or ', ' nearest the middle, else at the middle space.
function split2(s) {
  let best = -1;
  for (const sep of [': ', ', ']) for (let i = s.indexOf(sep); i > 0; i = s.indexOf(sep, i + 1))
    if (best < 0 || Math.abs(i - s.length / 2) < Math.abs(best - s.length / 2)) best = i + 1;
  if (best < 0 || Math.abs(best - s.length / 2) > s.length / 4) best = s.lastIndexOf(' ', s.length / 2);
  return [s.slice(0, best), s.slice(best + 1)];
}

function draw(t) {
  let at = 0, i = 0;
  while (i < SCENES.length - 1 && t >= at + len(SCENES[i])) { at += len(SCENES[i]); i++; }
  const [fn, d0, cap, subs] = SCENES[i];
  const d = len(SCENES[i]);
  const lt = t - at;
  const st = Math.min((t - at) / slow(SCENES[i]), d0 - .15);  // scene time, frozen near its end during the hold
  const last = i === SCENES.length - 1;
  const fade = P(lt, 0, FADE) * (last ? 1 : 1 - P(lt, d - FADE, d));  // fade in and out over FADE s; 0.14 s read as a cut
  const square = H >= W;
  const k = square ? .9 : 1;
  // the sub-caption shown now, and how far it has faded in
  let sub = '', ksub = 0;
  for (const [a, s] of subs) if (st >= a) { sub = s; ksub = P(st, a, a + .2, out); }
  let sx = (W - 1120 * k) / 2, sy, capSize, subSize, lines = cap ? [cap] : [], slines = [];
  if (!cap) sy = (H - 560 * k) / 2;
  else if (square) {
    if (cap.length > 24) lines = split2(cap);
    capSize = Math.min(60, 1000 / (Math.max(...lines.map(l => l.length)) * .56));
    subSize = 32;
    const subH = 2 * subSize * 1.25;   // room for two sub lines, so the stage does not jump
    const top = (H - (lines.length * capSize * 1.2 + 14 + subH + 40 + 560 * k)) / 2;
    lines = lines.map((l, j) => [l, top + capSize * (1 + 1.2 * j)]);
    const sTop = top + lines.length * capSize * 1.2 + 14;
    if (sub) slines = (sub.length > 34 ? split2(sub) : [sub]).map((l, j) => [l, sTop + subSize * (1 + 1.25 * j)]);
    sy = sTop + subH + 40;
  } else {
    capSize = Math.min(48, 1000 / (cap.length * .56));
    subSize = 27;
    lines = [[cap, 68]];
    if (sub) slines = [[sub, 112]];
    sy = 150;
  }
  const kcap = P(lt, 0, .3, out);
  const counter = `<g filter="url(#sh)"><rect x="28" y="24" width="82" height="42" rx="12" fill="${C.ink}" stroke="${C.ink}" stroke-width="3"/></g>`
    + text(69, 54, `${i + 1}/${SCENES.length}`, { size: 24, weight: 800, fill: C.yellow });
  document.getElementById('frame').innerHTML =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
<defs>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feOffset dx="6" dy="6" in="SourceAlpha"/><feComponentTransfer><feFuncA type="linear" slope="1"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${C.muted}"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${C.red}"/></marker>
</defs>
<rect width="${W}" height="${H}" fill="#fff8ef"/>
${counter}
${g(lines.map(([l, y]) => text(W / 2, y.toFixed(1), l, { size: capSize.toFixed(1), weight: 800 })).join(''), { op: fade * kcap, ty: L(14, 0, kcap) })}
${g(slines.map(([l, y]) => text(W / 2, y.toFixed(1), l, { size: subSize, weight: 600, fill: C.muted })).join(''), { op: fade * ksub, ty: L(10, 0, ksub) })}
<g transform="translate(${sx} ${sy}) scale(${k})" opacity="${fade.toFixed(3)}">${fn(st)}</g>
</svg>`;
}
draw(+(Q.get('t') || 0));
</script>
</body>
</html>
