<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, Helvetica, Arial, sans-serif">
  <!-- Social preview for github.com/elektricM/gpuq. Render: rsvg-convert -o social-preview.png social-preview.svg -->
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feOffset dx="6" dy="6" in="SourceAlpha"/><feComponentTransfer><feFuncA type="linear" slope="1"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="640" fill="#fff8ef"/>

  <!-- Name and problem -->
  <g filter="url(#sh)"><rect x="80" y="60" width="292" height="132" rx="24" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="4"/></g>
  <text x="226" y="160" text-anchor="middle" font-size="104" font-weight="800" fill="#ffd400">gpuq</text>
  <text x="1200" y="134" text-anchor="end" font-size="24" font-weight="600" fill="#4a4a4a">github.com/elektricM/gpuq</text>
  <text x="80" y="268" font-size="54" font-weight="800" fill="#1f1f1f">Stop "CUDA out of memory"</text>
  <text x="80" y="320" font-size="32" font-weight="500" fill="#4a4a4a">when Ollama, ComfyUI and your jobs share a GPU.</text>

  <!-- Programs asking for the GPUs: three placed, one waiting -->
  <g filter="url(#sh)">
    <rect x="80" y="370" width="190" height="46" rx="18" fill="#a66cff" stroke="#1f1f1f" stroke-width="3.5"/>
    <rect x="80" y="428" width="190" height="46" rx="18" fill="#3d8bff" stroke="#1f1f1f" stroke-width="3.5"/>
    <rect x="80" y="486" width="190" height="46" rx="18" fill="#00b37e" stroke="#1f1f1f" stroke-width="3.5"/>
  </g>
  <rect x="81.5" y="545.5" width="187" height="43" rx="17" fill="#ffffff" stroke="#4a4a4a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <g font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="175" y="401">Ollama</text>
    <text x="175" y="459">ComfyUI</text>
    <text x="175" y="517">training</text>
    <text x="175" y="575" font-weight="600" fill="#4a4a4a">render: waits</text>
  </g>

  <!-- gpuq in the middle -->
  <g fill="none" stroke="#4a4a4a" stroke-width="2.5">
    <path d="M274,393 C304,393 300,480 330,480" marker-end="url(#m)"/>
    <path d="M274,451 C304,451 300,480 330,480" marker-end="url(#m)"/>
    <path d="M274,509 C304,509 300,480 330,480" marker-end="url(#m)"/>
    <path d="M274,567 C304,567 300,480 330,480" stroke-dasharray="6 5"/>
  </g>
  <g filter="url(#sh)"><rect x="336" y="420" width="172" height="120" rx="22" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="4"/></g>
  <text x="422" y="494" text-anchor="middle" font-size="44" font-weight="800" fill="#ffd400">gpuq</text>
  <path d="M512,480 L560,480" stroke="#4a4a4a" stroke-width="3" marker-end="url(#m)"/>

  <!-- Two GPUs as VRAM bars -->
  <g filter="url(#sh)"><rect x="568" y="360" width="632" height="240" rx="22" fill="#ffffff" stroke="#00b37e" stroke-width="5"/></g>
  <g font-size="20" font-weight="700" fill="#4a4a4a">
    <text x="596" y="402">GPU 0 · 24 GB</text>
    <text x="596" y="502">GPU 1 · 24 GB</text>
  </g>
  <!-- GPU 0: the LLM alone; jobs never share a card with the loaded model -->
  <rect x="596" y="414" width="576" height="52" rx="8" fill="#f0e6d8"/>
  <rect x="596" y="414" width="408" height="52" rx="8" fill="#a66cff"/>
  <!-- GPU 1: ComfyUI and a training run side by side -->
  <rect x="596" y="514" width="576" height="52" rx="8" fill="#f0e6d8"/>
  <rect x="596" y="514" width="240" height="52" rx="8" fill="#3d8bff"/>
  <rect x="840" y="514" width="216" height="52" rx="8" fill="#00b37e"/>
  <g font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="800" y="448">Ollama</text>
    <text x="716" y="548">ComfyUI</text>
    <text x="948" y="548">training</text>
  </g>
</svg>
