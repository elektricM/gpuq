# Config of the throwaway daemon that records docs/demo.gif. record.sh replaces @DIR@ with
# this directory and runs it with its own ports, so it never meets a real gpuq.
# Two pretend 24 GB cards read through fake-vram.sh; an Ollama stand-in split over both.

[api]
port = 19390

[gate]
port = 19434
backend = "http://127.0.0.1:19435"

[llm]
backend = "ollama"
card = ["rtx3090-0", "rtx3090-1"]
resident = "qwen2.5:32b"
reload_delay_s = 2
gap_s = 1
idle_s = 3                  # batch jobs take the cards after 3 s without LLM requests

[gpu]
driver_settle_s = 0.5

[[gpu.card]]
name = "rtx3090-0"
vendor = "command"
command = ["@DIR@/fake-vram.sh", "rtx3090-0"]
visible_devices = "0"

[[gpu.card]]
name = "rtx3090-1"
vendor = "command"
command = ["@DIR@/fake-vram.sh", "rtx3090-1"]
visible_devices = "1"
