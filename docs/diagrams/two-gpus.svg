<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="t d">
<title id="t">Two GPUs, one queue</title>
<desc id="d">Two 24 GB cards, gpu0 and gpu1. 1: idle, the model qwen3.8:27b is split over both cards. 2: a training job asks for two cards with 20 GB each; the model is unloaded from both cards together and the job gets both at once. 3: single-card jobs go to whichever card has room: a Blender render and ComfyUI on gpu0, a training job and ffmpeg on gpu1. 4: the cards are idle again and the model is reloaded on both. A job never shares a card with the loaded model.</desc>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:15px;fill:#1f2328}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.h1{font-size:21px;font-weight:700}.h2{font-size:16px;font-weight:600}.sm{font-size:13px}.b{font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}
.mut{fill:#59636e}
.panel{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.card{fill:#ffffff;stroke:#d1d9e0;stroke-width:1}
.free{fill:#e6eaef}
.edge{fill:none;stroke:#59636e;stroke-width:1.5}
.ln{fill:none;stroke:#8c959f;stroke-width:1.6}.hd{fill:#8c959f}
.dash{stroke-dasharray:5 4}
.box{stroke-width:1.5}
.llm .box{fill:#fbefff;stroke:#8250df}.llm text{fill:#6639ba}.llm .bar{fill:#8250df}
.svc .box{fill:#ddf4ff;stroke:#0969da}.svc text{fill:#0550ae}.svc .bar{fill:#0969da}
.job .box{fill:#fff1e5;stroke:#bc4c00}.job text{fill:#953800}.job .bar{fill:#d4600d}
.gq .box{fill:#dafbe1;stroke:#1a7f37}.gq text{fill:#116329}.gq .bar{fill:#1f883d}
.err .box{fill:#ffebe9;stroke:#cf222e}.err text{fill:#a40e26}.err .bar{fill:#cf222e}.hatch{stroke:#cf222e}
.wait .box{fill:#ffffff;stroke:#8c959f;stroke-dasharray:5 4}.wait text{fill:#59636e}
.cli .box{fill:#ffffff;stroke:#8c959f}.cli text{fill:#1f2328}
g text.on{fill:#ffffff}
.dot{fill:#d1d9e0}.dot+text{fill:#1f2328}
</style>
</defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="539" rx="14"/>
<text class="h1" x="24" y="40">Two GPUs, one queue</text>
<text class="mut" x="24" y="64">24 GB each. A job never shares a card with the loaded model.</text>

<!-- 1 -->
<rect class="card" x="16" y="84" width="848" height="104" rx="10"/>
<circle class="dot" cx="44" cy="112" r="12"/><text class="sm b mid" x="44" y="117">1</text>
<text class="b" x="66" y="117">The model on both cards</text>
<text class="sm mut" x="66" y="140">One model split over gpu0 and gpu1,</text>
<text class="sm mut" x="66" y="158">loaded and unloaded together.</text>
<text class="mono sm mut end" x="360" y="122">gpu0</text><text class="mono sm mut end" x="360" y="162">gpu1</text>
<rect class="free" x="376" y="100" width="472" height="32" rx="6"/><rect class="free" x="376" y="140" width="472" height="32" rx="6"/>
<g class="llm"><rect class="bar" x="376" y="100" width="275" height="32" rx="6"/><rect class="bar" x="376" y="140" width="275" height="32" rx="6"/>
<rect class="box" x="370" y="94" width="287" height="84" rx="9" style="fill:none" stroke-dasharray="5 4"/>
<text class="on mono sm mid" x="513" y="121">qwen3.8:27b</text><text class="on mono sm mid" x="513" y="161">qwen3.8:27b</text></g>

<!-- 2 -->
<rect class="card" x="16" y="196" width="848" height="104" rx="10"/>
<circle class="dot" cx="44" cy="224" r="12"/><text class="sm b mid" x="44" y="229">2</text>
<text class="b" x="66" y="229">A job on both cards</text>
<text class="mono sm" x="66" y="252">gpuq run --cards 2 --vram 20G</text>
<text class="sm mut" x="66" y="272">The model leaves both cards, the job</text>
<text class="sm mut" x="66" y="290">gets both at once.</text>
<text class="mono sm mut end" x="360" y="234">gpu0</text><text class="mono sm mut end" x="360" y="274">gpu1</text>
<rect class="free" x="376" y="212" width="472" height="32" rx="6"/><rect class="free" x="376" y="252" width="472" height="32" rx="6"/>
<g class="job"><rect class="bar" x="376" y="212" width="393" height="32" rx="6"/><rect class="bar" x="376" y="252" width="393" height="32" rx="6"/>
<rect class="box" x="370" y="206" width="405" height="84" rx="9" style="fill:none" stroke-dasharray="5 4"/>
<text class="on sm mid" x="572" y="233">training · 20 GB</text><text class="on sm mid" x="572" y="273">training · 20 GB</text></g>

<!-- 3 -->
<rect class="card" x="16" y="308" width="848" height="104" rx="10"/>
<circle class="dot" cx="44" cy="336" r="12"/><text class="sm b mid" x="44" y="341">3</text>
<text class="b" x="66" y="341">Jobs go where there is room</text>
<text class="mono sm" x="66" y="364">gpuq run --vram 10G -- blender</text>
<text class="sm mut" x="66" y="384">Each job goes to a card that fits it.</text>
<text class="mono sm mut end" x="360" y="346">gpu0</text><text class="mono sm mut end" x="360" y="386">gpu1</text>
<rect class="free" x="376" y="324" width="472" height="32" rx="6"/><rect class="free" x="376" y="364" width="472" height="32" rx="6"/>
<g class="job"><rect class="bar" x="376" y="324" width="195" height="32" rx="6"/><text class="on sm mid" x="473" y="345">Blender render</text></g>
<g class="svc"><rect class="bar" x="574" y="324" width="236" height="32" rx="6"/><text class="on sm mid" x="692" y="345">ComfyUI</text></g>
<g class="job"><rect class="bar" x="376" y="364" width="314" height="32" rx="6"/><text class="on sm mid" x="533" y="385">training</text>
<rect class="bar" x="693" y="364" width="117" height="32" rx="6"/><text class="on sm mid" x="751" y="385">ffmpeg</text></g>

<!-- 4 -->
<rect class="card" x="16" y="420" width="848" height="104" rx="10"/>
<circle class="dot" cx="44" cy="448" r="12"/><text class="sm b mid" x="44" y="453">4</text>
<text class="b" x="66" y="453">Idle again</text>
<text class="sm mut" x="66" y="476">The model is reloaded on both</text>
<text class="sm mut" x="66" y="494">cards once both are free.</text>
<text class="mono sm mut end" x="360" y="458">gpu0</text><text class="mono sm mut end" x="360" y="498">gpu1</text>
<rect class="free" x="376" y="436" width="472" height="32" rx="6"/><rect class="free" x="376" y="476" width="472" height="32" rx="6"/>
<g class="llm"><rect class="bar" x="376" y="436" width="275" height="32" rx="6"/><rect class="bar" x="376" y="476" width="275" height="32" rx="6"/>
<rect class="box" x="370" y="430" width="287" height="84" rx="9" style="fill:none" stroke-dasharray="5 4"/>
<text class="on mono sm mid" x="513" y="457">qwen3.8:27b</text><text class="on mono sm mid" x="513" y="497">qwen3.8:27b</text></g>
</svg>
