<svg xmlns="http://www.w3.org/2000/svg" width="880" height="388" viewBox="0 0 880 388" role="img" aria-labelledby="t d">
<title id="t">Without and with gpuq</title>
<desc id="d">Without gpuq, Ollama with qwen3.8:27b (18 GB) and a ComfyUI workflow (12 GB) both load on one 24 GB GPU and ComfyUI crashes with CUDA out of memory. With gpuq, they go through gpuq and take turns: ComfyUI waits, the model is unloaded while ComfyUI runs, then reloaded.</desc>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:15px;fill:#1f2328}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.h1{font-size:21px;font-weight:700}.h2{font-size:16px;font-weight:600}.sm{font-size:13px}.b{font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}
.mut{fill:#59636e}
.panel{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.card{fill:#ffffff;stroke:#d1d9e0;stroke-width:1}
.free{fill:#e6eaef}
.edge{fill:none;stroke:#59636e;stroke-width:1.5}
.ln{fill:none;stroke:#8c959f;stroke-width:1.6}.hd{fill:#8c959f}
.dash{stroke-dasharray:5 4}
.box{stroke-width:1.5}
.llm .box{fill:#fbefff;stroke:#8250df}.llm text{fill:#6639ba}.llm .bar{fill:#8250df}
.svc .box{fill:#ddf4ff;stroke:#0969da}.svc text{fill:#0550ae}.svc .bar{fill:#0969da}
.job .box{fill:#fff1e5;stroke:#bc4c00}.job text{fill:#953800}.job .bar{fill:#d4600d}
.gq .box{fill:#dafbe1;stroke:#1a7f37}.gq text{fill:#116329}.gq .bar{fill:#1f883d}
.err .box{fill:#ffebe9;stroke:#cf222e}.err text{fill:#a40e26}.err .bar{fill:#cf222e}.hatch{stroke:#cf222e}
.wait .box{fill:#ffffff;stroke:#8c959f;stroke-dasharray:5 4}.wait text{fill:#59636e}
.cli .box{fill:#ffffff;stroke:#8c959f}.cli text{fill:#1f2328}
g text.on{fill:#ffffff}
.dot{fill:#d1d9e0}.dot+text{fill:#1f2328}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hd" d="M0,0 L10,5 L0,10 z"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="8" stroke-width="3"/></pattern>
</defs>

<!-- Without -->
<rect class="panel" x="0.5" y="0.5" width="424" height="387" rx="14"/>
<text class="h1" x="24" y="40">Without gpuq</text>
<text class="mut" x="24" y="64">Each program assumes it has the card.</text>

<g class="llm"><rect class="box" x="24" y="86" width="180" height="58" rx="10"/>
<text class="h2" x="40" y="110">Ollama</text><text class="mono sm" x="40" y="132">qwen3.8:27b · 18 GB</text></g>
<g class="svc"><rect class="box" x="220" y="86" width="180" height="58" rx="10"/>
<text class="h2" x="236" y="110">ComfyUI</text><text class="sm" x="236" y="132">workflow · 12 GB</text></g>

<path class="ln" d="M114,146 V198" marker-end="url(#ah)"/>
<path class="ln" d="M310,146 V198" marker-end="url(#ah)"/>

<rect class="free" x="24" y="206" width="300" height="40" rx="6"/>
<g class="llm"><rect class="bar" x="24" y="206" width="225" height="40" rx="6"/><text class="on mono sm mid" x="136" y="231">qwen3.8:27b</text></g>
<g class="svc"><rect class="bar" x="251" y="206" width="73" height="40"/><text class="on sm mid" x="287" y="231">ComfyUI</text></g>
<rect x="324" y="206" width="75" height="40" rx="0" fill="url(#hatch)" opacity="0.7"/>
<rect class="edge" x="24" y="206" width="300" height="40" rx="6"/>
<text class="sm mut" x="24" y="268">GPU · 24 GB</text>
<g class="err"><text class="sm b end" x="400" y="268">6 GB over</text></g>

<g class="err"><rect class="box" x="24" y="290" width="376" height="74" rx="10"/>
<text class="h2" x="40" y="318">ComfyUI crashes</text>
<text class="mono sm" x="40" y="344">CUDA out of memory</text></g>

<!-- With -->
<rect class="panel" x="455.5" y="0.5" width="424" height="387" rx="14"/>
<text class="h1" x="480" y="40">With gpuq</text>
<text class="mut" x="480" y="64">Programs take turns on the card.</text>

<g class="llm"><rect class="box" x="480" y="86" width="180" height="58" rx="10"/>
<text class="h2" x="496" y="110">Ollama</text><text class="mono sm" x="496" y="132">qwen3.8:27b · 18 GB</text></g>
<g class="svc"><rect class="box" x="676" y="86" width="180" height="58" rx="10"/>
<text class="h2" x="692" y="110">ComfyUI</text><text class="sm" x="692" y="132">workflow · 12 GB</text></g>

<path class="ln" d="M570,146 V166" marker-end="url(#ah)"/>
<path class="ln" d="M766,146 V166" marker-end="url(#ah)"/>
<g class="gq"><rect class="box" x="480" y="172" width="376" height="40" rx="10"/>
<text class="mono h2" x="496" y="198">gpuq</text><text class="sm end" x="840" y="197">queue by priority and free VRAM</text></g>
<path class="ln" d="M668,214 V232" marker-end="url(#ah)"/>

<g>
<circle class="dot" cx="492" cy="257" r="12"/><text class="sm b mid" x="492" y="262">1</text>
<rect class="free" x="514" y="240" width="240" height="34" rx="6"/>
<g class="llm"><rect class="bar" x="514" y="240" width="180" height="34" rx="6"/><text class="on mono sm mid" x="604" y="262">qwen3.8:27b</text></g>
<text class="sm mut" x="766" y="262">ComfyUI waits</text>

<circle class="dot" cx="492" cy="301" r="12"/><text class="sm b mid" x="492" y="306">2</text>
<rect class="free" x="514" y="284" width="240" height="34" rx="6"/>
<g class="svc"><rect class="bar" x="514" y="284" width="120" height="34" rx="6"/><text class="on sm mid" x="574" y="306">ComfyUI</text></g>
<text class="sm mut" x="766" y="306">model unloaded</text>

<circle class="dot" cx="492" cy="345" r="12"/><text class="sm b mid" x="492" y="350">3</text>
<rect class="free" x="514" y="328" width="240" height="34" rx="6"/>
<g class="llm"><rect class="bar" x="514" y="328" width="180" height="34" rx="6"/><text class="on mono sm mid" x="604" y="350">qwen3.8:27b</text></g>
<text class="sm mut" x="766" y="350">model reloaded</text>
</g>
</svg>
