name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-musl
            rpm_arch: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked --version 0.2.5

      - name: Install musl-tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Check the binary is static
        run: file target/${{ matrix.target }}/release/gpuq

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Package
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          name="gpuq-${version}-${target}"
          mkdir -p dist "stage/${name}"
          cp "target/${target}/release/gpuq" README.md CHANGELOG.md LICENSE "stage/${name}/"
          cp -r examples man completions docs "stage/${name}/"
          mkdir -p "stage/${name}/packaging"
          cp -r packaging/systemd "stage/${name}/packaging/systemd"
          tar -C stage -czf "dist/${name}.tar.gz" "${name}"
          cargo deb --no-build --no-strip --target "${target}" --output dist/
          cargo generate-rpm --target "${target}" -o dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor the dependencies
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cargo vendor --locked vendor > /dev/null
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            -cJf "dist/gpuq-${version}-vendor.tar.xz" vendor
          cp packaging/vendor-config.toml "dist/gpuq-${version}-vendor-config.toml"
          ls -l dist
      - name: Check an offline build from the vendored sources
        run: |
          set -eux
          cat packaging/vendor-config.toml >> .cargo/config.toml
          CARGO_HOME="$RUNNER_TEMP/empty-cargo-home" cargo build --offline --locked
      - uses: actions/upload-artifact@v4
        with:
          name: dist-vendor
          path: dist/*

  release:
    needs: [build, vendor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
