[package]
name = "gpuq"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "GPU scheduler for Linux: priority classes, leases and VRAM accounting for jobs and services"
license = "GPL-3.0-or-later"
repository = "https://github.com/elektricM/gpuq"
readme = "README.md"
authors = ["Martin Dolez"]
homepage = "https://github.com/elektricM/gpuq"
keywords = ["gpu", "scheduler", "vram", "queue", "llm"]
categories = ["command-line-utilities"]
include = [
    "/src/",
    "/tests/",
    "/docs/",
    "/examples/",
    "/man/",
    "/completions/",
    "/packaging/systemd/",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[workspace]
members = ["xtask"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client-legacy"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Martin Dolez <martin@dolez.fr>"
copyright = "2026 Martin Dolez"
section = "utils"
priority = "optional"
extended-description = """\
gpuq decides who owns the GPU: an LLM server behind an HTTP gate, or leased jobs, \
with priority classes, idle timers and leases tied to their connection."""
maintainer-scripts = "packaging/deb/"
conf-files = ["/etc/gpuq/config.toml"]
assets = [
    ["target/release/gpuq", "usr/bin/gpuq", "755"],
    ["packaging/systemd/gpuq.service", "usr/lib/systemd/system/gpuq.service", "644"],
    ["packaging/systemd/gpuq.user.service", "usr/lib/systemd/user/gpuq.service", "644"],
    ["packaging/systemd/gpuq.sysusers", "usr/lib/sysusers.d/gpuq.conf", "644"],
    ["examples/gpuq.toml", "etc/gpuq/config.toml", "644"],
    ["examples/*", "usr/share/doc/gpuq/examples/", "644"],
    ["man/*.1", "usr/share/man/man1/", "644"],
    ["completions/gpuq.bash", "usr/share/bash-completion/completions/gpuq", "644"],
    ["completions/_gpuq", "usr/share/zsh/vendor-completions/_gpuq", "644"],
    ["completions/gpuq.fish", "usr/share/fish/vendor_completions.d/gpuq.fish", "644"],
    ["README.md", "usr/share/doc/gpuq/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/gpuq/CHANGELOG.md", "644"],
    ["docs/*.md", "usr/share/doc/gpuq/docs/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gpuq", dest = "/usr/bin/gpuq", mode = "755" },
    { source = "packaging/systemd/gpuq.service", dest = "/usr/lib/systemd/system/gpuq.service", mode = "644" },
    { source = "packaging/systemd/gpuq.user.service", dest = "/usr/lib/systemd/user/gpuq.service", mode = "644" },
    { source = "packaging/systemd/gpuq.sysusers", dest = "/usr/lib/sysusers.d/gpuq.conf", mode = "644" },
    { source = "examples/gpuq.toml", dest = "/etc/gpuq/config.toml", mode = "644", config = "noreplace" },
    { source = "examples/*", dest = "/usr/share/doc/gpuq/examples/", mode = "644", doc = true },
    { source = "man/*.1", dest = "/usr/share/man/man1/", mode = "644", doc = true },
    { source = "completions/gpuq.bash", dest = "/usr/share/bash-completion/completions/gpuq", mode = "644" },
    { source = "completions/_gpuq", dest = "/usr/share/zsh/site-functions/_gpuq", mode = "644" },
    { source = "completions/gpuq.fish", dest = "/usr/share/fish/vendor_completions.d/gpuq.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/gpuq/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/gpuq/CHANGELOG.md", mode = "644", doc = true },
    { source = "docs/*.md", dest = "/usr/share/doc/gpuq/docs/", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/gpuq/LICENSE", mode = "644", doc = true },
]
post_install_script = "command -v systemd-sysusers >/dev/null 2>&1 && systemd-sysusers gpuq.conf || true"
